  cot_editor:
    default:
      text: |
        1. 题意与要解释的硬件层次
        先区分线程分组和执行处理器两个层次：warp 是线程组织方式，SM 是运行这些线程的硬件位置，二者不能视为同一种资源。

        2. 相关部件及其关系
        一个线程块分配到 SM 后拆成若干 warp；一个 SM 可驻留多个 warp，但寄存器和共享内存会限制同时驻留的数量。

        3. 与 CUDA 编程模型的对应
        CUDA 线程属于线程块，线程块映射到 SM，warp 调度器从就绪 warp 中挑选指令，等待内存的 warp 可以让出发射机会。

        4. 代际差异与前提
        warp 宽度通常为 32 个线程，但每个 SM 的调度器和资源上限依架构变化，讨论占用率前必须说明具体代际。

        5. 常见误区
        不要把 warp 当成 SM，也不要把本机的 SM 容量写成所有 NVIDIA GPU 都满足的常数。

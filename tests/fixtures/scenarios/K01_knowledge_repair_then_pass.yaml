  knowledge_repair:
    c1r1:
      text: |
        ## 结论
        在 NVIDIA CUDA 编程模型中，warp 是一组通常由 32 个线程组成的调度单元，SM 是执行这些 warp 的处理器。一个 SM 可以同时驻留多个 warp，但驻留数量受寄存器、共享内存和线程块资源限制。

        ## 机制
        线程块分配到某个 SM 后，其中的线程按 warp 组织。调度器从就绪 warp 中选择可发射的指令；当某个 warp 等待内存时，其他就绪 warp 可以前进，从而隐藏部分延迟。warp 与 SM 不处于相同层级：前者是线程分组，后者是执行资源。

        ## 适用边界
        warp 宽度是 NVIDIA CUDA 的模型属性，但每个 SM 的调度器数量、可驻留 warp 上限与共享资源容量取决于具体架构。分析占用率时应注明 GPU 代际和资源用量，不能把本机数值推广到所有设备。
      reasoning: "上一版太短，需要修复。KNOWLEDGE_REPAIR_REASONING"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuda-sft"
version = "0.2.0"
description = "CUDA kernel SFT data generation and numeric validation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.2.6",
  "langgraph>=1.1.10",
  "anthropic>=0.100.0",
  "openai>=2.35.0",
  "python-dotenv>=1.2.2",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.15.0",
  "tqdm>=4.67.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.3",
  "pytest-xdist>=3.5",
  "hypothesis>=6.100",
  "pyyaml>=6",
  "jsonschema>=4.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "coverage>=7.5",
]
triton = ["torch", "triton"]
tilelang = ["torch", "tilelang>=0.1.14"]

[project.scripts]
cuda-sft = "cuda_sft.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
timeout = 300
markers = [
  "unit: pure unit tests (default)",
  "component: LangGraph/scheduler scenario tests with fakes",
  "gpu: needs a CUDA GPU and nvcc",
  "e2e: end-to-end replay runs",
  "live: calls real LLM APIs (manual only)",
  "load: load tests",
  "chaos: fault-injection tests",
  "dataset: dataset acceptance checks",
]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["cuda_gen_fix", "work", "data", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "cuda_sft.core.*",
  "cuda_sft.oracle.*",
  "cuda_sft.storage.*",
  "cuda_sft.runtime.*",
  "cuda_sft.exec.*",
  "cuda_sft.llm.gateway",
]
strict = true
